---
repos:
  - repo: https://github.com/siderolabs/conform
    rev: v0.1.0-alpha.33
    hooks:
      - id: conform
        stages:
          - commit-msg
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(sdk/|provider/cmd/pulumi-resource-proxmoxve/.*\.json$)
      - id: trailing-whitespace
        exclude: ^(sdk/|provider/cmd/pulumi-resource-proxmoxve/.*\.json$)
      - id: check-json
        exclude: ^(sdk/|node_modules/|\.devcontainer/devcontainer\.json$|provider/cmd/pulumi-resource-proxmoxve/.*\.json$)
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [
            "--allow-missing-credentials"
        ]
      - id: detect-private-key
        exclude: ^node_modules/
#      - id: no-commit-to-branch
#        args: [
#            "--branch",
#            "main",
#            "--branch",
#            "next"
#        ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- markdownlint-cli2
        language: system
        files: ^(README\.md|JAVA_GPG\.md|CODE-OF-CONDUCT\.md|docs/.*\.md)$
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd provider && mise exec -- golangci-lint run -c ../.golangci.yml'
        language: system
        files: ^(provider/.*\.go|provider/go\.(mod|sum)|\.golangci\.yml)$
        pass_filenames: false
